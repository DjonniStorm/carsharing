# Статика web на GitHub Pages (project site: https://<user>.github.io/<repo>/).
# Backend и WS — отдельный хост; URL задаётся секретом VITE_API_BASE_URL.

name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/**'
      - 'packages/validation/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared validation package
        run: pnpm -F @carsharing/validation build

      - name: Build web
        env:
          # Project Pages: https://<owner>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_YANDEX_MAPS_API_KEY: ${{ secrets.VITE_YANDEX_MAPS_API_KEY }}
        run: pnpm -F @carsharing/web build

      - name: SPA fallback (404 → index.html)
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
