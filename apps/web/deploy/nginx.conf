# Пример для личного VPS. Подставьте домены и пути.
#
# Схема:
#   app.example.com  => статика из ./dist (после pnpm build в apps/web)
#   api.example.com  => NestJS :3000 + Socket.IO /trip
#
# Сборка:
#   cd apps/web
#   VITE_API_BASE_URL=https://api.example.com pnpm build
#   sudo rsync -a dist/ /var/www/carsharing-web/

# --- HTTP => HTTPS (опционально) ---
# server {
#     listen 80;
#     server_name app.example.com api.example.com;
#     return 301 https://$host$request_uri;
# }

# --- Web (SPA) ---
server {
    listen 443 ssl http2;
    server_name app.example.com;

    # ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    root /var/www/carsharing-web;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}

# --- API + WebSocket (NestJS) ---
server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /trip/ {
        proxy_pass http://127.0.0.1:3000/trip/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
