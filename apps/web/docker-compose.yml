# Локальная сборка/проверка образа web (без edge proxy).
# Prod: deploy/docker-compose.prod.yml

services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY}
        VITE_OPEN_MANAGER_SELF_REGISTER: ${VITE_OPEN_MANAGER_SELF_REGISTER:-true}
    image: carsharing-web:latest
    container_name: carsharing-web
    restart: unless-stopped
    ports:
      - '8080:80'
