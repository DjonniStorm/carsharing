org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Вариант нативной библиотеки Yandex MapKit (lite | full). Должен совпадать
# с зависимостью `com.yandex.android:maps.mobile:4.22.0-<variant>` в app/build.gradle.kts.
yandexMapkit.variant=lite

# Workaround for Kotlin incremental cache issues on Windows with different drive roots (C: pub-cache, D: project).
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
