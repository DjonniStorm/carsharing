# Часть @carsharing/backend: Prometheus + Grafana.
# Требует, чтобы был поднят основной compose (apps/backend/docker-compose.yml),
# который создаёт docker-сеть `carsharing` и сервис `backend:3000`.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: carsharing-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - carsharing_prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=512MB'
    networks: [carsharing]
    mem_limit: 384m

  grafana:
    image: grafana/grafana:11.5.2
    container_name: carsharing-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - carsharing_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [carsharing]
    mem_limit: 320m

volumes:
  carsharing_prom_data:
  carsharing_grafana_data:

networks:
  carsharing:
    external: true
