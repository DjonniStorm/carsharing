services:
  telemetry-car-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: carsharing-telemetry:local
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:3000}
      ROUTING_URL: ${ROUTING_URL:-}
      ROUTING_PROFILE: ${ROUTING_PROFILE:-driving}
      TELEMETRY_DEVICE_KEY: ${TELEMETRY_DEVICE_KEY:-dev-telemetry-key}
      CAR_ID: ${CAR_1_ID}
      INITIAL_LAT: ${CAR_1_INITIAL_LAT:-54.3282}
      INITIAL_LON: ${CAR_1_INITIAL_LON:-48.3866}
      ROUTE_MIN_LAT: ${ROUTE_MIN_LAT:-54.27}
      ROUTE_MIN_LON: ${ROUTE_MIN_LON:-48.28}
      ROUTE_MAX_LAT: ${ROUTE_MAX_LAT:-54.39}
      ROUTE_MAX_LON: ${ROUTE_MAX_LON:-48.50}
      ROUTE_SEED: ${CAR_1_ROUTE_SEED:-101}
      INITIAL_FUEL_LEVEL: ${CAR_1_INITIAL_FUEL_LEVEL:-78}
      IDLE_TELEMETRY_INTERVAL_SEC: ${IDLE_TELEMETRY_INTERVAL_SEC:-10}
      ACTIVE_TELEMETRY_INTERVAL_SEC: ${ACTIVE_TELEMETRY_INTERVAL_SEC:-10}
      TRIP_POLL_INTERVAL_SEC: ${TRIP_POLL_INTERVAL_SEC:-5}
      MIN_SPEED_KMH: ${MIN_SPEED_KMH:-12}
      MAX_SPEED_KMH: ${MAX_SPEED_KMH:-54}
      SPEEDING_CHANCE: ${SPEEDING_CHANCE:-0.08}
      DESTINATION_REFRESH_METERS: ${DESTINATION_REFRESH_METERS:-140}
      TELEMETRY_SOURCE: fake-car-bun-1

